[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "rna-design-cli"
version = "0.4.0"
description = "Auditable, local RNA inverse design with gRNAde, Struct2SeQ and NA-MPNN"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
fold = ["ViennaRNA==2.7.2"]
structure = ["biopython==1.86"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "ViennaRNA==2.7.2", "biopython==1.86"]

[project.scripts]
rna-design = "rna_design.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rna_design"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the installed real model runtime"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
